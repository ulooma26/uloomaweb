<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your Ụlọ Ọma account">
    <title>Login — Ụlọ Ọma</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <header class="sticky top-0 bg-white z-50">
        <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
            <div class="cursor-pointer" onclick="window.location.href='index.html'">
                <img src="./images/Logo.PNG" alt="Ụlọ Ọma" class="h-12 md:h-14" />
            </div>
            <!-- Mobile Menu Button -->
            <button id="mobileMenuBtn" class="md:hidden text-gray-800 focus:outline-none">
                <i class="bi bi-list text-3xl"></i>
            </button>
            <nav class="hidden md:flex gap-10 lg:gap-16 text-[19px] font-semibold text-black">
                <a href="index.html" class="hover:text-[#20ACB3] transition">Home</a>
                <a href="explore.html" class="hover:text-[#20ACB3] transition">Explore</a>
                <a href="how-it-works.html" class="hover:text-[#20ACB3] transition">How it works</a>
                <a href="about.html" class="hover:text-[#20ACB3] transition">About Us</a>
                <a href="contact.html" class="hover:text-[#20ACB3] transition">Contact Us</a>
            </nav>
            <div class="hidden md:block">
                <button onclick="window.location.href='signup.html'" class="bg-[#20ACB3] text-white rounded-[30px] py-[15px] px-[30px] hover:bg-black transition text-[19px] font-medium cursor-pointer">
                    Sign Up
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="hidden md:hidden bg-white border-t border-gray-100 px-6 py-4">
            <nav class="flex flex-col gap-4 text-[17px] font-medium text-gray-800">
                <a href="index.html" class="hover:text-[#20ACB3] transition">Home</a>
                <a href="explore.html" class="hover:text-[#20ACB3] transition">Explore</a>
                <a href="how-it-works.html" class="hover:text-[#20ACB3] transition">How it works</a>
                <a href="about.html" class="hover:text-[#20ACB3] transition">About Us</a>
                <a href="contact.html" class="hover:text-[#20ACB3] transition">Contact Us</a>
                <button onclick="window.location.href='signup.html'" class="bg-[#20ACB3] text-white rounded-[20px] py-3 px-6 mt-2 hover:bg-black transition">
                    Sign Up
                </button>
            </nav>
        </div>
    </header>

    <!-- Screen 1: Login - Welcome Back -->
    <div id="loginScreen1" class="flex min-h-[calc(100vh-100px)]">
        <!-- Left Side - Form -->
        <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 sm:px-12 lg:px-16 bg-gradient-to-b from-white to-gray-50">
          
            <!-- Heading -->
            <div class="mb-10">
                <h1 class="text-4xl font-bold text-[#0F3B3D] mb-3">Welcome Back Again!!!</h1>
                <p class="text-[#5C6F70] text-sm leading-relaxed max-w-sm">Quickly Log into your account to enjoy your time finding apartments to the fullest.</p>
            </div>

            <!-- Error Message -->
            <div id="loginError" class="hidden mb-6 p-4 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100">
                Invalid email or password.
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-6 mb-8 max-w-sm">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-[#5C6F70] mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="emailInput"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#20ACB3] focus:ring-2 focus:ring-[#82E4E9] transition"
                        required
                    >
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-[#5C6F70] mb-2">Password</label>
                    <input 
                        type="password" 
                        id="passwordInput"
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#20ACB3] focus:ring-2 focus:ring-[#82E4E9] transition"
                        required
                    >
                    <div class="text-right mt-2">
                        <a href="forgot-password.html" class="text-sm text-[#20ACB3] hover:text-[#0F3B3D] transition">Forgot password?</a>
                    </div>
                </div>

                <!-- Continue Button -->
                <button 
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-[#20ACB3] hover:bg-black text-white font-semibold py-3 rounded-[20px] transition duration-200 mt-8 flex justify-center items-center h-[52px]"
                >
                    <span id="btnText">Login</span>
                    <i id="btnLoader" class="bi bi-arrow-repeat animate-spin hidden text-xl"></i>
                </button>
            </form>
        </div>

        <!-- Right Side - Image with Icon -->
        <div class="hidden lg:flex lg:w-1/2 bg-[#0F3B3D] relative overflow-hidden items-center justify-center">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-32 h-32 bg-white rounded-4xl shadow-lg">
                    <svg class="w-16 h-16 text-[#0F3B3D]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser } from './js/auth.js';

        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const submitBtn = document.getElementById('submitBtn');

            // Reset error
            errorDiv.classList.add('hidden');
            
            // Loading state
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                // Call Supabase auth (mocked/imported)
                if (typeof loginUser === 'function') {
                    const result = await loginUser(email, password);
                    if (result && result.error) {
                        throw new Error(result.error.message || 'Login failed');
                    }
                } else {
                    // Fallback simulation
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                // Redirect on success
                window.location.href = 'tenant-dashboard.html';
            } catch (err) {
                // Show error
                errorDiv.textContent = err.message || 'Invalid email or password.';
                errorDiv.classList.remove('hidden');
                
                // Reset button
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

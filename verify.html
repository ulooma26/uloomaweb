<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Phone — Ụlọ Ọma</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="./images/image.png" type="image/png">
</head>
<body class="bg-[#F8FBFB] min-h-screen flex items-center justify-center font-sans p-4">
    <div class="bg-white rounded-4xl shadow-2xl p-8 md:p-10 w-full max-w-md border border-gray-100 text-center">
        <!-- Logo with Tagline underneath -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex flex-col items-center group">
                <img src="./images/Logo.PNG" alt="Ụlọ Ọma Logo" class="h-12 w-auto object-contain" />
                <span class="block text-xs text-[#5C6F70] font-normal italic tracking-tight mt-1">...your comfort, our priority.</span>
            </a>
            <h1 class="text-2xl font-extrabold text-[#0F3B3D] mt-6 mb-2">Verify Your Phone</h1>
            <p class="text-gray-500 text-xs">Enter the 6-digit verification code sent to your mobile device</p>
        </div>
        
        <form id="otpForm" class="space-y-6">
            <div class="flex gap-2 sm:gap-3 justify-center">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
                <input type="text" maxlength="1" class="otp-input w-11 h-12 text-center border-2 border-gray-200 rounded-xl text-xl font-bold focus:border-[#20ACB3] focus:outline-none focus:ring-2 focus:ring-[#82E4E9]">
            </div>
            
            <button type="submit" class="w-full bg-[#20ACB3] hover:bg-[#0F3B3D] text-white py-4 rounded-xl font-bold transition shadow-lg text-sm cursor-pointer">
                Verify & Continue
            </button>
        </form>
        
        <div class="mt-6 text-xs text-gray-500">
            Didn't receive the code? 
            <button onclick="alert('New verification code sent!')" class="text-[#20ACB3] font-bold hover:underline ml-1 cursor-pointer">Resend Code</button>
        </div>
    </div>
    
    <script>
        document.querySelectorAll('.otp-input').forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value && index < 5) {
                    document.querySelectorAll('.otp-input')[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    document.querySelectorAll('.otp-input')[index - 1].focus();
                }
            });
        });

        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'tenant-dashboard.html';
        });
    </script>
</body>
</html>
